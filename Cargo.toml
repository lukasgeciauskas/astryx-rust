[workspace]
resolver = "3"
members = [
    "crates/astryx",
    "crates/astryx-theme",
    "crates/astryx-primitives",
    "crates/astryx-i18n",
    "crates/astryx-effects",
    "crates/astryx-icons",
    "crates/astryx-components",
    "crates/astryx-themes",
    "apps/gallery",
    "apps/cli",
    "examples/consumer",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.100"
publish = false

[workspace.dependencies]
# GPUI comes from our fork (Zed main plus our renderer patches; see
# docs/gpui-fork.md), pinned to one revision. Every app that uses Astryx must
# resolve GPUI to this same revision, or Cargo builds two incompatible copies.
# Bump it only with `cargo xtask bump-gpui <rev>` followed by a full test run.
gpui = { git = "https://github.com/lukasgeciauskas/zed", rev = "7ce1c61f5c6d01ac3275aa81448915e2b421d3ee" }
# `multithreaded` (the default) needs nightly Rust for wasm; we stay on stable.
gpui_platform = { git = "https://github.com/lukasgeciauskas/zed", rev = "7ce1c61f5c6d01ac3275aa81448915e2b421d3ee", default-features = false }

astryx = { path = "crates/astryx" }
astryx-theme = { path = "crates/astryx-theme" }
astryx-primitives = { path = "crates/astryx-primitives" }
astryx-i18n = { path = "crates/astryx-i18n", default-features = false }
astryx-effects = { path = "crates/astryx-effects" }
astryx-icons = { path = "crates/astryx-icons" }
astryx-components = { path = "crates/astryx-components" }
astryx-themes = { path = "crates/astryx-themes", default-features = false }

# The accessibility tree types GPUI uses; keep it at GPUI's version.
accesskit = "0.24.1"
anyhow = "1"
# ICU4X, the CLDR data behind upstream's `Intl.*`, at the version GPUI already uses.
icu_decimal = { version = "2.4", features = ["alloc", "ryu"] }
# Percent and relative-time formatting (`Intl.NumberFormat` percent, `Intl.RelativeTimeFormat`).
icu_experimental = "0.7"
icu_datetime = "2.4"
icu_time = "2.4"
icu_calendar = "2.4"
# Time zones: IANA rules and the system zone, bundled on Windows and wasm.
jiff = { version = "1", features = ["tzdb-bundle-always"] }
writeable = "0.6"
icu_list = "2.4"
icu_locale = "2.4"
icu_plurals = "2.4"
icu_normalizer = "2.4"
web-time = "1.1"
serde_json = "1"
wasm-bindgen = "0.2.120"

# Zed's workspace patches two crates that GPUI depends on. Patches only apply
# at the root of a workspace, so we mirror them here, and consuming apps must
# mirror them too (see README).
[patch.crates-io]
async-task = { git = "https://github.com/smol-rs/async-task", rev = "41fd3359c75e221bd8b187a8ee361aa309c1714c" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }

[profile.dev]
split-debuginfo = "unpacked"
incremental = true
codegen-units = 16
debug = "limited"

[profile.dev.build-override]
codegen-units = 16
split-debuginfo = "unpacked"
debug = "limited"

[profile.dev.package]
gpui_macros = { opt-level = 3 }
derive_refineable = { opt-level = 3 }
quote = { opt-level = 3 }
syn = { opt-level = 3 }
proc-macro2 = { opt-level = 3 }
taffy = { opt-level = 3 }
resvg = { opt-level = 3 }
serde_json = { opt-level = 3 }

[profile.release]
debug = "limited"
lto = "thin"
codegen-units = 1
