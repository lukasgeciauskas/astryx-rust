[package]
name = "astryx-gallery"
description = "Storybook-style gallery for the Astryx GPUI components"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "astryx-gallery"
path = "src/main.rs"

[features]
# Hot-patching for `cargo xtask dev` (debug builds only).
hot-reload = ["gpui/hot-reload", "dep:backtrace"]

[dependencies]
anyhow.workspace = true
astryx = { workspace = true, features = ["json-themes"] }
gpui.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[target.'cfg(windows)'.dependencies]
backtrace = { version = "0.3", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { workspace = true, features = ["wayland", "x11"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
gpui_platform.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen.workspace = true
web-sys = { version = "0.3", features = ["Window", "Location"] }
