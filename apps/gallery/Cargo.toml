[package]
name = "rustryx-gallery"
description = "Storybook-style gallery for the Rustryx GPUI components"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "rustryx-gallery"
path = "src/main.rs"

[features]
# Hot-patching for `cargo xtask dev` (debug builds only).
hot-reload = ["gpui/hot-reload", "dep:backtrace"]

[dependencies]
anyhow.workspace = true
rustryx = { workspace = true, features = ["json-themes", "charts", "lab"] }
gpui.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[target.'cfg(windows)'.dependencies]
backtrace = { version = "0.3", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { workspace = true, features = ["wayland", "x11"] }

# GPUI's macOS text system (Core Text through font-kit); without it macOS
# draws no text.
[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { workspace = true, features = ["font-kit"] }

[target.'cfg(not(any(target_os = "linux", target_os = "macos")))'.dependencies]
gpui_platform.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen.workspace = true
web-sys = { version = "0.3", features = ["Window", "Location"] }
