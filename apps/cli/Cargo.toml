[package]
name = "rustryx-cli"
description = "The rustryx CLI for the Rust port: component docs, tokens, guides and port parity, for people and coding agents"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "rustryx"
path = "src/main.rs"

[dependencies]
rustryx-components.workspace = true
rustryx-charts.workspace = true
rustryx-lab.workspace = true
rustryx-theme.workspace = true
rustryx-themes = { workspace = true, features = ["all"] }
serde_json.workspace = true
