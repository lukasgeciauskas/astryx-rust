[package]
name = "astryx-markdown"
description = "Markdown's parser: upstream Astryx's own, ported, onto its canonical mdast-aligned AST"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
# NFKC for heading-links slugs (upstream `normalize('NFKC')`).
icu_normalizer.workspace = true
# Upstream's `new URL(base, …)` check of a heading-links permalink base.
url = "2.5"
