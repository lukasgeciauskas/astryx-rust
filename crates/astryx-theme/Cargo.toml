[package]
name = "astryx-theme"
description = "Astryx design tokens and themes for GPUI"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Load themes from their typed JSON at run time (live theme reload).
json = ["dep:serde_json"]

[dependencies]
anyhow.workspace = true
serde_json = { workspace = true, optional = true }
astryx-primitives.workspace = true
gpui.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
