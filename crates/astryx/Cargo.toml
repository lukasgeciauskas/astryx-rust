[package]
name = "astryx"
description = "Astryx design system for GPUI"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["themes", "locales"]
# The 30 translated catalogs Astryx ships (English is always included).
locales = ["astryx-i18n/locales"]
# Every published theme. Turn off default features and pick `theme-*`
# features to ship only the themes (and fonts) an app uses.
themes = ["theme-butter", "theme-chocolate", "theme-gothic", "theme-matcha", "theme-neutral", "theme-stone", "theme-y2k"]
theme-butter = ["dep:astryx-themes", "astryx-themes/butter"]
theme-chocolate = ["dep:astryx-themes", "astryx-themes/chocolate"]
theme-gothic = ["dep:astryx-themes", "astryx-themes/gothic"]
theme-matcha = ["dep:astryx-themes", "astryx-themes/matcha"]
theme-neutral = ["dep:astryx-themes", "astryx-themes/neutral"]
theme-stone = ["dep:astryx-themes", "astryx-themes/stone"]
theme-y2k = ["dep:astryx-themes", "astryx-themes/y2k"]
# Load themes from their typed JSON at run time (`Theme::from_json`).
json-themes = ["astryx-theme/json"]
# Charts (upstream `@astryxdesign/charts`).
charts = ["dep:astryx-charts"]
# The lab components (upstream `@astryxdesign/lab`).
lab = ["dep:astryx-lab", "charts"]

[dependencies]
gpui.workspace = true
astryx-theme.workspace = true
astryx-syntax.workspace = true
astryx-markdown.workspace = true
astryx-themes = { workspace = true, optional = true }
astryx-primitives.workspace = true
astryx-i18n.workspace = true
astryx-effects.workspace = true
astryx-icons.workspace = true
astryx-components.workspace = true
astryx-charts = { workspace = true, optional = true }
astryx-lab = { workspace = true, optional = true }
