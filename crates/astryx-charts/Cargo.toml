[package]
name = "astryx-charts"
description = "Astryx charts for GPUI: scales, shapes, Chart and its marks (upstream @astryxdesign/charts)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
astryx-components.workspace = true
astryx-effects.workspace = true
astryx-i18n.workspace = true
astryx-icons.workspace = true
astryx-primitives.workspace = true
astryx-theme.workspace = true
gpui.workspace = true
icu_calendar.workspace = true
icu_datetime.workspace = true
icu_decimal = { workspace = true, features = ["unstable"] }
icu_experimental.workspace = true
icu_list.workspace = true
icu_locale.workspace = true
jiff.workspace = true
unicode-segmentation.workspace = true
web-time.workspace = true
writeable.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
astryx-themes = { workspace = true, features = ["butter", "neutral"] }
