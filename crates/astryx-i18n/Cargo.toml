[package]
name = "astryx-i18n"
description = "Astryx's internationalization runtime on GPUI: locales, catalogs, ICU messages and text direction"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["locales"]
# The 30 translated catalogs Astryx ships. English is always included.
locales = []

[dependencies]
astryx-primitives.workspace = true
gpui.workspace = true
icu_calendar.workspace = true
icu_collator.workspace = true
icu_datetime.workspace = true
icu_decimal.workspace = true
icu_experimental.workspace = true
icu_list.workspace = true
icu_locale.workspace = true
icu_normalizer.workspace = true
icu_properties.workspace = true
icu_plurals.workspace = true
icu_time.workspace = true
jiff.workspace = true
writeable.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
