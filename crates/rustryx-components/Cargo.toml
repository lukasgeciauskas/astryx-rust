[package]
name = "rustryx-components"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
rustryx-primitives.workspace = true
rustryx-effects.workspace = true
rustryx-i18n.workspace = true
rustryx-icons.workspace = true
rustryx-theme.workspace = true
rustryx-syntax.workspace = true
rustryx-markdown.workspace = true
fancy-regex.workspace = true
gpui.workspace = true
smallvec = "1"
# Decoded photos (Lightbox's examples and tests); already in GPUI's tree.
image = { version = "0.25", default-features = false }
web-time.workspace = true
unicode-segmentation.workspace = true
unicode-linebreak.workspace = true
anyhow.workspace = true
serde_json.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
gpui_web.workspace = true
# The browser's speech recognition and Web Audio, for dictation on the web.
wasm-bindgen.workspace = true
js-sys = "0.3"
# The browser's `(pointer: coarse)`, for the press controller's touch-first device.
web-sys = { version = "0.3", features = ["Window", "MediaQueryList"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
rustryx-themes = { workspace = true, features = ["neutral"] }
