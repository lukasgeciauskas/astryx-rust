name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # No debug info in CI builds: it is most of `target`, which the Linux runner's disk
  # (and the cache step's save) otherwise runs out of room for.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang lld libfontconfig-dev libglib2.0-dev \
            libssl-dev libvulkan1 libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libzstd-dev
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Generated code is up to date
        if: runner.os == 'Linux'
        run: cargo xtask codegen --check

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build the gallery for the browser
        run: cargo build -p rustryx-gallery --target wasm32-unknown-unknown

  # macOS: the same checks, then the platform's own proof. The gallery and the
  # GPUI fork's astryx_* examples run and are captured (tools/ci-macos.sh), and
  # the fork's Metal renderer tests run; the screenshots are the
  # `macos-screenshots` artifact (`gh run download <id> -n macos-screenshots`).
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build the gallery
        run: cargo build -p rustryx-gallery
      - name: Gallery screenshots
        run: tools/ci-macos.sh gallery
      - name: The GPUI fork's Metal tests and astryx examples
        run: tools/ci-macos.sh fork
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-screenshots
          path: target/screenshots
          if-no-files-found: warn
